name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftformat:
    name: SwiftFormat lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftFormat 0.62.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/swiftformat_linux.zip \
            https://github.com/nicklockwood/SwiftFormat/releases/download/0.62.1/swiftformat_linux.zip
          echo "61ff55f3581e2144a4ad114831167102c38be853df75c1477d20b40a8e8120aa  /tmp/swiftformat_linux.zip" \
            | sha256sum -c -
          unzip -o /tmp/swiftformat_linux.zip -d /tmp
          chmod +x /tmp/swiftformat_linux
          sudo mv /tmp/swiftformat_linux /usr/local/bin/swiftformat
          swiftformat --version
      - name: Lint Swift sources
        run: |
          swiftformat --lint --config .swiftformat \
            PiMPAudioStudio PiMPAudioStudioTests PiMPAudioCore

  remote-worker:
    name: Remote worker (ruff + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: remote-worker
          args: check --config remote-worker/ruff.toml
      - name: Unit tests
        run: python3 -m unittest discover -s remote-worker/tests -v

  pimpaudiocore:
    name: PiMPAudioCore compile tests
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Swift 6.2)
        run: scripts/ci-select-xcode.sh
      - name: Compile PiMPAudioCore and its tests
        run: |
          set -euo pipefail
          # SwiftPM test *execution* cannot load mlx default.metallib in this
          # environment (documented in docs/full-rebrand-plan.md). Compile is
          # still a useful gate; MLX-backed suites run via Xcode locally / app tests.
          swift build --package-path PiMPAudioCore --build-tests

  app-tests:
    name: App unit tests
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (Swift 6.2)
        run: scripts/ci-select-xcode.sh
      - name: Test PiMPAudioStudio
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme PiMPAudioStudio \
            -destination 'platform=macOS' \
            -only-testing:PiMPAudioStudioTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""
