name: PiMPAudioStudio
options:
  bundleIdPrefix: com.pimpstudios
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

packages:
  PiMPAudioCore:
    path: ./PiMPAudioCore
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.21.0
  swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    from: 0.12.1

targets:
  PiMPAudioStudio:
    type: application
    platform: macOS
    sources: [PiMPAudioStudio]
    dependencies:
      - package: PiMPAudioCore
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXNN
      - package: swift-sdk
        product: MCP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pimpstudios.PiMPAudioStudio
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.music"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: "PiMP Audio Studio"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_TESTABILITY: YES
    entitlements:
      path: PiMPAudioStudio/PiMPAudioStudio.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.temporary-exception.files.absolute-path.read-only:
          - /opt/homebrew/
          - /usr/local/
          - /opt/local/
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /.cache/huggingface/
          - /.codex/
          - /.grok/
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /.gemini/

  PiMPAudioStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PiMPAudioStudioTests]
    dependencies:
      - target: PiMPAudioStudio
      - package: PiMPAudioCore
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PiMPAudioStudio:
    build:
      targets:
        PiMPAudioStudio: all
    test:
      targets:
        - PiMPAudioStudioTests
    run:
      config: Debug
