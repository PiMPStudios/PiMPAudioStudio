name: PiMPAudioStudio
options:
  bundleIdPrefix: com.pimpstudios
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

packages:
  PiMPAudioCore:
    path: ./PiMPAudioCore
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.3
  swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    exactVersion: 0.12.1

targets:
  PiMPAudioStudio:
    type: application
    platform: macOS
    sources: [PiMPAudioStudio]
    # Offline user help: copy docs/user/*.md into the app bundle as Help/.
    preBuildScripts:
      - name: Sync User Help Docs
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/docs/user"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Help"
          if [[ ! -d "$SRC" ]]; then
            echo "warning: missing user docs at $SRC" >&2
            exit 0
          fi
          mkdir -p "$DST"
          rm -f "$DST"/*.md
          cp "$SRC"/*.md "$DST/"
          echo "note: synced $(ls -1 "$DST"/*.md | wc -l | tr -d ' ') help page(s) into app bundle"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: PiMPAudioCore
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXNN
      - package: swift-sdk
        product: MCP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pimpstudios.PiMPAudioStudio
        DEVELOPMENT_TEAM: F3S7J7L552
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.8.0"
        CURRENT_PROJECT_VERSION: 8
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.music"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 PiMP Studios"
        INFOPLIST_KEY_CFBundleDisplayName: "PiMP Audio Studio"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_TESTABILITY: NO
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
        Release:
          ENABLE_TESTABILITY: NO
    entitlements:
      path: PiMPAudioStudio/PiMPAudioStudio.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.temporary-exception.files.absolute-path.read-only:
          - /opt/homebrew/
          - /usr/local/
          - /opt/local/
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /.cache/huggingface/
          - /.codex/
          - /.grok/
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /.gemini/

  PiMPAudioStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PiMPAudioStudioTests]
    dependencies:
      - target: PiMPAudioStudio
      - package: PiMPAudioCore
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXNN
      - package: mlx-swift
        product: MLXOptimizers
    settings:
      base:
        DEVELOPMENT_TEAM: F3S7J7L552
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PiMPAudioStudio:
    build:
      targets:
        PiMPAudioStudio: all
    test:
      targets:
        - PiMPAudioStudioTests
    run:
      config: Debug
